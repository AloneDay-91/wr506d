api_platform:
    title: WR506 - API
    version: 1.0.0
    show_webby: false
    graphql:
        enabled: true
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        pagination_items_per_page: 30           # Nombre par défaut par page
        pagination_maximum_items_per_page: 100  # Maximum autorisé
        pagination_client_items_per_page: true  # Permet au client de choisir

    formats:
        jsonld: ['application/ld+json']
        multipart: ['multipart/form-data']
        json: ['application/json']
